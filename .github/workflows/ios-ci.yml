name: Melora iOS CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==============================================================================
  # Job 1: SwiftLint Static Analysis
  # ==============================================================================
  lint:
    name: SwiftLint Static Analysis
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run SwiftLint
        run: |
          if which swiftlint >/dev/null; then
            swiftlint lint --strict --config .swiftlint.yml
          else
            echo "SwiftLint not found preinstalled, installing via Homebrew..."
            export HOMEBREW_NO_AUTO_UPDATE=1
            brew install swiftlint
            swiftlint lint --strict --config .swiftlint.yml
          fi

  # ==============================================================================
  # Job 2: Swift 6 Packages Build & Unit Tests
  # ==============================================================================
  swift-packages:
    name: Swift Packages Build & Test
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package:
          - MeloraCore
          - MeloraData
          - MeloraAudio
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Dynamically Select Xcode 16+
        run: |
          echo "Scanning available Xcode installations on runner:"
          ls -d /Applications/Xcode* 2>/dev/null || true
          
          # Search for any installed Xcode 16.x or highest version available
          TARGET_XCODE=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" -o -name "Xcode*.app" | sort -V | tail -n 1)
          if [ -n "$TARGET_XCODE" ] && [ -d "$TARGET_XCODE" ]; then
            echo "Dynamically switching to Xcode: $TARGET_XCODE"
            sudo xcode-select -s "$TARGET_XCODE"
          else
            echo "No matching Xcode bundle found in /Applications, using system default"
          fi
          
          xcodebuild -version
          swift --version

      - name: Build Package (${{ matrix.package }})
        run: |
          mkdir -p logs
          swift build --package-path ${{ matrix.package }} 2>&1 | tee logs/build-${{ matrix.package }}.log

      - name: Test Package (${{ matrix.package }})
        run: |
          mkdir -p logs
          swift test --package-path ${{ matrix.package }} --enable-code-coverage 2>&1 | tee logs/test-${{ matrix.package }}.log

      - name: Upload Package Logs (${{ matrix.package }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.package }}
          path: logs/
          retention-days: 7

  # ==============================================================================
  # Job 3: iOS 18 Simulator Build
  # ==============================================================================
  ios-simulator-build:
    name: iOS 18 Simulator Build
    needs: [swift-packages]
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Dynamically Select Xcode 16+
        run: |
          TARGET_XCODE=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" -o -name "Xcode*.app" | sort -V | tail -n 1)
          if [ -n "$TARGET_XCODE" ] && [ -d "$TARGET_XCODE" ]; then
            echo "Dynamically switching to Xcode: $TARGET_XCODE"
            sudo xcode-select -s "$TARGET_XCODE"
          fi
          xcodebuild -version

      - name: Verify Project & Scheme
        run: |
          if [ ! -d "Melora.xcodeproj" ]; then
            echo "Melora.xcodeproj not present, attempting XcodeGen generation..."
            export HOMEBREW_NO_AUTO_UPDATE=1
            brew install xcodegen
            xcodegen generate
          fi
          
          echo "Verified project structure. Available schemes:"
          xcodebuild -list -project Melora.xcodeproj

      - name: Build Melora for iOS Simulator
        run: |
          mkdir -p build_output logs
          set -o pipefail
          xcodebuild \
            -project Melora.xcodeproj \
            -scheme MeloraApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee logs/xcodebuild-simulator.log

      - name: Inspect Built App Bundle
        run: |
          APP_PATH=$(find .build/DerivedData/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find .build/DerivedData -name "*.app" -type d | head -n 1)
          fi
          if [ -n "$APP_PATH" ]; then
            echo "Successfully built application bundle at: $APP_PATH"
            ls -la "$APP_PATH"
          else
            echo "App bundle not found in DerivedData"
            exit 1
          fi

      - name: Upload Build Logs & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build-logs
          path: logs/
          retention-days: 7

  # ==============================================================================
  # Job 4: Cross-Platform Fast Verification
  # ==============================================================================
  cross-platform-tests:
    name: Cross-Platform Logic & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
