# ==============================================================================
# Melora — Codemagic CI/CD Pipeline Configuration
# Native iOS 18+ / Swift 6 / SwiftUI Music Player
# ==============================================================================

workflows:
  melora-ios-release-build:
    name: Melora iOS Release Build (Unsigned Verification)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: 16.0
      vars:
        XCODE_PROJECT: "Melora.xcodeproj"
        XCODE_SCHEME: "MeloraApp"
        BUNDLE_ID: "com.melora.music"

    triggering:
      events:
        - push
        - pull_request
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: develop
          include: true
          source: true

    scripts:
      - name: Environment Diagnostics & Tool Versions
        script: |
          echo "=== System Information ==="
          sw_vers
          uname -m
          echo "=== Developer Tools ==="
          xcodebuild -version
          swift --version
          echo "=== Xcode Projects and Schemes ==="
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Run Swift 6 Package Tests
        script: |
          echo "=== Testing MeloraCore ==="
          swift test --package-path MeloraCore
          echo "=== Testing MeloraData ==="
          swift test --package-path MeloraData
          echo "=== Testing MeloraAudio ==="
          swift test --package-path MeloraAudio
          echo "=== MeloraUI is validated during Xcode iOS build ==="

      - name: Run Cross-Platform Contract Verification Suite
        script: |
          echo "=== Running 44 Unit Tests (SQLite, Models, Spotify PKCE, Storage, ViewModels) ==="
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Build Melora App (Release Configuration - Unsigned)
        script: |
          mkdir -p build/DerivedData build/output
          set -o pipefail

          # Build for generic iOS device with code signing temporarily disabled
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build/output/xcodebuild.log

      - name: Package Unsigned Application Artifact
        script: |
          set -e
          echo "=== Inspecting Xcode Build Output in DerivedData ==="
          ls -la build/DerivedData/Build/Products/Release-iphoneos/ 2>/dev/null || true

          # Dynamically locate the built application bundle
          APP_PATH=$(find build/DerivedData/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: No .app bundle was found in build/DerivedData"
            echo "=== Recent Xcode Build Log Output ==="
            tail -n 100 build/output/xcodebuild.log || true
            exit 1
          fi

          echo "Found application bundle at: $APP_PATH"
          APP_NAME=$(basename "$APP_PATH")

          # 1. Verify Info.plist exists
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Info.plist not found in $APP_PATH"
            exit 1
          fi
          echo "✓ Verified: Info.plist exists in $APP_PATH"

          # 2. Verify CFBundleIdentifier
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist" 2>/dev/null || plutil -extract CFBundleIdentifier raw "$APP_PATH/Info.plist" 2>/dev/null || echo "unknown")
          echo "✓ Verified: CFBundleIdentifier is '$BUNDLE_ID'"

          # 3. Verify App Executable exists
          EXECUTABLE_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist" 2>/dev/null || plutil -extract CFBundleExecutable raw "$APP_PATH/Info.plist" 2>/dev/null || echo "${APP_NAME%.app}")
          if [ ! -f "$APP_PATH/$EXECUTABLE_NAME" ]; then
            echo "ERROR: Executable '$EXECUTABLE_NAME' not found in $APP_PATH"
            exit 1
          fi
          EXEC_SIZE=$(wc -c < "$APP_PATH/$EXECUTABLE_NAME" | tr -d ' ')
          echo "✓ Verified: Executable '$EXECUTABLE_NAME' exists ($EXEC_SIZE bytes)"

          # 4. Package verified app into standard iOS Payload structure for unsigned IPA
          echo "=== Packaging Unsigned IPA (Payload/Melora.app) ==="
          rm -rf build/output/Payload
          mkdir -p build/output/Payload
          cp -R "$APP_PATH" build/output/Payload/Melora.app

          # Also create Melora-unsigned.app bundle copy
          rm -rf build/output/Melora-unsigned.app
          cp -R "$APP_PATH" build/output/Melora-unsigned.app

          cd build/output
          zip -r -y "Melora-unsigned.ipa" "Payload"
          zip -r -y "Melora-iOS-unsigned.app.zip" "Melora-unsigned.app"
          cd -

          # 5. Validate the generated IPA archive structure
          echo "=== Validating Generated IPA Archive ==="
          if unzip -l build/output/Melora-unsigned.ipa | grep -q "Payload/Melora.app/Info.plist"; then
            echo "✓ SUCCESS: Melora-unsigned.ipa contains 'Payload/Melora.app/Info.plist'"
          else
            echo "ERROR: Melora-unsigned.ipa validation failed: Payload/Melora.app/Info.plist is missing"
            exit 1
          fi

          if unzip -l build/output/Melora-unsigned.ipa | grep -q "Payload/Melora.app/"; then
            echo "✓ SUCCESS: Melora-unsigned.ipa contains Payload directory structure"
          else
            echo "ERROR: Missing Payload directory in IPA archive"
            exit 1
          fi

          echo "=== Package Artifact Summary ==="
          ls -lh build/output/Melora-unsigned.ipa
          ls -lh build/output/Melora-iOS-unsigned.app.zip

    artifacts:
      - build/output/Melora-unsigned.ipa
      - build/output/Melora-iOS-unsigned.app.zip
      - build/output/xcodebuild.log
