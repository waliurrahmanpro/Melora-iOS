# ==============================================================================
# Melora — Codemagic CI/CD Pipeline Configuration
# Native iOS 18+ / Swift 6 / SwiftUI Music Player
# ==============================================================================

workflows:
  melora-ios-release-build:
    name: Melora iOS Release Build (Unsigned Verification)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: 16.0
      vars:
        XCODE_PROJECT: "Melora.xcodeproj"
        XCODE_SCHEME: "MeloraApp"
        BUNDLE_ID: "com.melora.music"

    triggering:
      events:
        - push
        - pull_request
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: develop
          include: true
          source: true

    scripts:
      - name: Environment Diagnostics & Tool Versions
        script: |
          echo "=== System Information ==="
          sw_vers
          uname -m
          echo "=== Developer Tools ==="
          xcodebuild -version
          swift --version
          echo "=== Xcode Projects and Schemes ==="
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Run Swift 6 Package Tests
        script: |
          echo "=== Testing MeloraCore ==="
          swift test --package-path MeloraCore
          echo "=== Testing MeloraData ==="
          swift test --package-path MeloraData
          echo "=== Testing MeloraAudio ==="
          swift test --package-path MeloraAudio
          echo "=== MeloraUI is validated during Xcode iOS build ==="

      - name: Run Cross-Platform Contract Verification Suite
        script: |
          echo "=== Running 44 Unit Tests (SQLite, Models, Spotify PKCE, Storage, ViewModels) ==="
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Build Melora App (Release Configuration - Unsigned)
        script: |
          mkdir -p build/DerivedData build/output
          set -o pipefail

          # Build for generic iOS device with code signing temporarily disabled
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build/output/xcodebuild.log

      - name: Package Unsigned Application Artifact
        script: |
          set -e
          echo "=== Inspecting Xcode Build Output in DerivedData ==="
          ls -la build/DerivedData/Build/Products/Release-iphoneos/ 2>/dev/null || true

          # 1. Dynamically locate the built application bundle, preferring device Release-iphoneos
          APP_PATH=""
          if [ -d "build/DerivedData/Build/Products/Release-iphoneos" ]; then
            APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData -name "*.app" -type d ! -path "*-iphonesimulator/*" | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: No .app bundle was found in build/DerivedData"
            echo "=== Recent Xcode Build Log Output ==="
            tail -n 100 build/output/xcodebuild.log || true
            exit 1
          fi

          echo "Found application bundle at: $APP_PATH"
          INFO_PLIST="$APP_PATH/Info.plist"

          # 2. Verify Info.plist exists
          if [ ! -f "$INFO_PLIST" ]; then
            echo "ERROR: Info.plist not found in $APP_PATH"
            exit 1
          fi
          echo "✓ Verified: Info.plist exists at $INFO_PLIST"

          # 3. Verify CFBundleIdentifier equals com.melora.music
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO_PLIST" 2>/dev/null || true)
          if [ "$BUNDLE_ID" != "com.melora.music" ]; then
            echo "ERROR: Expected CFBundleIdentifier 'com.melora.music', but got '$BUNDLE_ID'"
            exit 1
          fi
          echo "✓ Verified: CFBundleIdentifier is '$BUNDLE_ID'"

          # 4. Read CFBundleExecutable safely via PlistBuddy
          set +e
          EXECUTABLE_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$INFO_PLIST" 2>&1)
          PLIST_STATUS=$?
          set -e

          if [ $PLIST_STATUS -ne 0 ] || [ -z "$EXECUTABLE_NAME" ]; then
            echo "ERROR: CFBundleExecutable is missing or invalid in $INFO_PLIST"
            echo "PlistBuddy status: $PLIST_STATUS, output: $EXECUTABLE_NAME"
            echo "=== Actual Info.plist Contents ==="
            /usr/libexec/PlistBuddy -c "Print" "$INFO_PLIST" 2>/dev/null || cat "$INFO_PLIST"
            exit 1
          fi
          echo "✓ Verified: CFBundleExecutable key found: '$EXECUTABLE_NAME'"

          # 5. Verify App Executable file exists and is non-empty
          EXECUTABLE_PATH="$APP_PATH/$EXECUTABLE_NAME"
          if [ ! -f "$EXECUTABLE_PATH" ]; then
            echo "ERROR: Executable binary not found at $EXECUTABLE_PATH"
            echo "Directory listing of $APP_PATH:"
            ls -la "$APP_PATH"
            exit 1
          fi

          if [ ! -s "$EXECUTABLE_PATH" ]; then
            echo "ERROR: Executable binary at $EXECUTABLE_PATH is empty (0 bytes)"
            exit 1
          fi

          EXEC_SIZE=$(wc -c < "$EXECUTABLE_PATH" | tr -d ' ')
          echo "✓ Verified: Executable '$EXECUTABLE_NAME' exists and is non-empty ($EXEC_SIZE bytes)"

          # 6. Package verified app into standard iOS Payload structure for unsigned IPA
          echo "=== Packaging Unsigned IPA (Payload/Melora.app) ==="
          rm -rf build/output/Payload
          mkdir -p build/output/Payload
          cp -R "$APP_PATH" build/output/Payload/Melora.app

          # Also create Melora-unsigned.app bundle copy for direct inspection
          rm -rf build/output/Melora-unsigned.app
          cp -R "$APP_PATH" build/output/Melora-unsigned.app

          cd build/output
          zip -r -y "Melora-unsigned.ipa" "Payload"
          zip -r -y "Melora-iOS-unsigned.app.zip" "Melora-unsigned.app"
          cd -

          # 7. Validate the generated IPA archive structure
          echo "=== Validating Generated IPA Archive ==="
          if ! unzip -l build/output/Melora-unsigned.ipa | grep -q "Payload/Melora.app/Info.plist"; then
            echo "ERROR: Melora-unsigned.ipa validation failed: Payload/Melora.app/Info.plist is missing"
            exit 1
          fi
          echo "✓ SUCCESS: IPA archive contains 'Payload/Melora.app/Info.plist'"

          if ! unzip -l build/output/Melora-unsigned.ipa | grep -q "Payload/Melora.app/$EXECUTABLE_NAME"; then
            echo "ERROR: Melora-unsigned.ipa validation failed: Payload/Melora.app/$EXECUTABLE_NAME is missing"
            exit 1
          fi
          echo "✓ SUCCESS: IPA archive contains 'Payload/Melora.app/$EXECUTABLE_NAME'"

          echo "=== Package Artifact Summary ==="
          ls -lh build/output/Melora-unsigned.ipa
          ls -lh build/output/Melora-iOS-unsigned.app.zip

    artifacts:
      - build/output/Melora-unsigned.ipa
      - build/output/Melora-iOS-unsigned.app.zip
      - build/output/xcodebuild.log
